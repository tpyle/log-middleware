# Dependabot configuration. See
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Every Go module in the repository. Keep in sync with the CI matrix.
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/v3/zerologmw"
      - "/v3/logrusmw"
      - "/examples"
    schedule:
      interval: "weekly"
    ignore:
      # Modules from this repository are replaced with local paths, and their
      # required versions are set by hand at release time.
      - dependency-name: "github.com/tpyle/log-middleware/*"
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
